# Offline OpenAI-compatible embeddings upstream for the kind chaos cluster
# (scripts/ha/mock_embeddings.py; up.sh creates the `mock-embeddings` ConfigMap
# from it). Not for production.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-embeddings
  labels: { app.kubernetes.io/name: mock-embeddings }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: mock-embeddings }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mock-embeddings }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: server
          image: docker.io/library/python:3.13.18-alpine@sha256:7984cf56ceaddebe4fefeb75d64000b9f45d8b77b11a09b24524da6cdc3af0c8
          command: ["python", "/app/mock_embeddings.py"]
          env:
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - { name: app, mountPath: /app }
      volumes:
        - name: app
          configMap: { name: mock-embeddings }
---
apiVersion: v1
kind: Service
metadata:
  name: mock-embeddings
  labels: { app.kubernetes.io/name: mock-embeddings }
spec:
  selector: { app.kubernetes.io/name: mock-embeddings }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
# The chart's default-deny covers this namespace: open embeddings -> mock.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mock-embeddings
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: mock-embeddings }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/component: embeddings }
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: embeddings-to-mock-embeddings
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/component: embeddings }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: mock-embeddings }
      ports:
        - { protocol: TCP, port: 8080 }

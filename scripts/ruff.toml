# Ruff config for the repo tooling scripts; same rules as the Python services.
# No lockfile here: required-version keeps it on the CI ruff (RUFF_VERSION).
required-version = "==0.15.15"
line-length = 100
target-version = "py313"

[lint]
select = ["E", "F", "I", "UP", "B"]

[lint.per-file-ignores]
# Synthetic demo-corpus prose: long string literals are content, not code.
"corpus/content/*.py" = ["E501"]
# Markdown-table fixtures inside test strings.
"notices/test_check_review.py" = ["E501"]

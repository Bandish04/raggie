        passage: "The save desk started on 1 March 2026. Accounts with a health score below 40 are flagged automatically and contacted by a Customer Success Specialist within 5 business days. Between March and June the save desk contacted 58 at-risk accounts and saved 23 of them. The most effective interventions were a free onboarding refresh (11 saves) and moving the customer to annual prepay (7 saves)."
    answer: "Since 1 March 2026 the save desk contacts accounts whose health score is under 40 within five business days. From March to June it reached 58 at-risk accounts and kept 23 of them."

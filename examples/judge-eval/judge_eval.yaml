# Labeled faithfulness set for the eval worker's LLM judge (bench/judge_eval.py).
# Every context passage is quoted verbatim from examples/sample-corpus; the
# answers were written by hand. Schema and labeling rules: README.md next to
# this file. Validate with `make eval-judge ARGS=--dry-run`.
version: 1
corpus: "../sample-corpus"  # relative to this file
items:
  - id: "en-001"
    language: en
    label: faithful
    tags: [paraphrase, unit_format]
    context:
      - document: "Load_Test_Report_2026_Q2.docx"
        passage: "Between 2 and 6 June 2026 we ran a staged load test against a production-sized replica of the IST-1 environment running NebulaCRM v3.3. The goal was to confirm that the platform can sustain 3,000 requests per second (RPS) for 60 minutes with a p95 latency below 250 ms, which is the capacity we need for the second half of 2026."
    answer: "The load test ran from 2 to 6 June 2026 on a production-sized replica of IST-1 running NebulaCRM v3.3. Its goal was to show that the platform can hold 3,000 RPS for an hour with a p95 latency under 250 ms."
  - id: "en-002"
    language: en
    label: faithful
    context:
      - document: "Load_Test_Report_2026_Q2.docx"
        passage: "The target was met. At 3,000 RPS sustained for 60 minutes the API recorded a p95 latency of 212 ms, a p99 latency of 480 ms and an error rate of 0.04%. The platform kept scaling until 4,150 RPS, where the primary PostgreSQL node reached 92% CPU and latency degraded sharply; we treat 4,150 RPS as the current breaking point."
    answer: "Yes. At a sustained 3,000 requests per second the p95 latency was 212 ms and the error rate 0.04%. The breaking point is 4,150 RPS, where the primary PostgreSQL node reached 92% CPU."
  - id: "en-003"
    language: en
    label: faithful
    tags: [paraphrase, multi_passage]
    context:
      - document: "NebulaCRM_API_v3_Reference.md"
        passage: "Rate limits are applied per token (per API key or per OAuth client) using a sliding one-minute window. Short bursts of up to twice the per-minute limit are tolerated for at most 10 seconds."
      - document: "NebulaCRM_API_v3_Reference.md"
        passage: "Every response carries the headers X-RateLimit-Limit, X-RateLimit-Remaining and X-RateLimit-Reset. When the limit is exceeded the API returns HTTP 429 with a Retry-After header giving the number of seconds to wait. Clients must honour Retry-After; tokens that keep sending requests while throttled for more than 15 minutes may be suspended."
    answer: "Limits are counted per API key or OAuth client over a sliding one-minute window. If you go over them the API answers with HTTP 429, and you have to wait the number of seconds given in the Retry-After header."
  - id: "en-004"
    language: en
    label: faithful
    tags: [unit_format]
    context:
      - document: "NebulaCRM_API_v3_Reference.md"
        passage: "List endpoints use cursor-based pagination. The default page size is 50 records and the maximum is 200; pass the limit query parameter to change it. Each response includes a next_cursor field, which is null on the last page. Cursors expire after 24 hours. Offset-based pagination from API v2 is not available in v3."
    answer: "List endpoints return 50 records per page by default and up to 200 with the limit parameter. Cursors stay valid for one day."
  - id: "en-005"
    language: en
    label: faithful
    tags: [unit_format, paraphrase]
    context:
      - document: "NebulaCRM_API_v3_Reference.md"
        passage: "Your endpoint must answer with a 2xx status within 10 seconds. Failed deliveries are retried 6 times with exponential backoff over roughly 24 hours, at 1 minute, 5 minutes, 30 minutes, 2 hours, 6 hours and 15 hours after the first attempt. After the sixth failed retry the event is dropped and the endpoint is flagged in the admin console; an endpoint that fails for 3 consecutive days is disabled."
    answer: "A failed webhook delivery is retried six times with exponential backoff over about a day, the last retry coming 15 hours after the first attempt. After that the event is dropped and the endpoint is flagged in the admin console."
  - id: "en-006"
    language: en
    label: faithful
    context:
      - document: "Engineering_Code_Review_Guidelines.txt"
        passage: "Changes in critical paths require 2 approvals: billing, authentication, tenancy and permission checks, data migrations and anything that touches encryption keys. At least one of the two approvers must be listed in the CODEOWNERS file for that path. All other changes require 1 approval. Authors cannot approve their own pull requests, and an approval is dismissed automatically when new commits are pushed."
    answer: "Changes to billing, authentication, tenancy and permission checks, data migrations or encryption keys need two approvals, and at least one approver must be listed in CODEOWNERS for that path."
  - id: "en-007"
    language: en
    label: faithful
    tags: [unit_format, paraphrase]
    context:
      - document: "Engineering_Code_Review_Guidelines.txt"
        passage: "We ship on a release train every 2 weeks on Tuesday. The release branch is cut at 09:00 on release day from main; anything merged after that waits for the next train. Release candidates must pass the quality gate run by the Quality team before the Go/No-Go meeting at 14:00. No trains run during the year-end freeze."
    answer: "Releases ship every other Tuesday. The release branch is cut from main at 9 a.m. on release day, and the Go/No-Go meeting is at 2 p.m."
  - id: "en-008"
    language: en
    label: faithful
    tags: [unit_format]
    context:
      - document: "Postmortem_INC-2026-0417_Database_Outage.pdf"
        passage: "On 17 April 2026, from 09:12 to 11:59 TRT (167 minutes), the primary PostgreSQL cluster in IST-1 stopped accepting writes. WAL archiving had stalled the previous evening after an object-storage credential rotation; un-archived WAL segments accumulated until the primary's data volume filled up, and the cluster manager fenced the primary into read-only mode to protect data integrity. During the incident 38% of API requests failed with 5xx errors and 286 customer accounts were affected. No customer data was lost."
    answer: "For 2 hours and 47 minutes on 17 April 2026 the primary PostgreSQL cluster in IST-1 accepted no writes. 38% of API requests failed and 286 customer accounts were affected, but no customer data was lost."
  - id: "en-009"
    language: en
    label: faithful
    tags: [paraphrase]
    context:
      - document: "Postmortem_INC-2026-0417_Database_Outage.pdf"
        passage: "We deliberately did not fail over to a replica. Promoting a replica would not have cleared the WAL backlog on the old primary and would have risked a split-brain during the credential fix. In hindsight this was the right call: once the archiver had valid credentials, the backlog of roughly 1,900 segments drained in 45 minutes and writes were re-enabled without a topology change."
    answer: "The team chose not to fail over because promoting a replica would not have cleared the WAL backlog on the old primary and could have caused a split-brain. Once the archiver had valid credentials, about 1,900 segments drained in 45 minutes."

        passage: "We lost 41 customer logos in the first half of 2026. The customer base still grew from 1,180 on 31 December 2025 to 1,326 on 30 June 2026, but every lost logo costs us roughly three months of new-logo sales effort to replace. Annualised gross logo churn for H1 2026 was 6.9%, down from 7.8% for full-year 2025."

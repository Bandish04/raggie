    language: en
    label: faithful
    tags: [unit_format]
    context:
      - document: "Investor_Update_Q3_2026.pdf"
        passage: "In lira terms, Q3 revenue was TRY 198.4M and nine-month revenue TRY 536.9M, which is 99.2% of the nine-month budget. Cash on hand at quarter end was TRY 612.5M; we have not drawn on the Series B proceeds for operating expenses since February 2026."
    answer: "Nine-month revenue was TRY 536.9 million, 99.2% of the nine-month budget, and cash on hand at the end of the quarter was TRY 612.5 million."

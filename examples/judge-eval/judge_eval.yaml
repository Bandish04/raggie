        passage: "Churn remains concentrated in small accounts: 24 of the 41 churned customers were on the Başlangıç plan and none were on Kurumsal Plus. Price and budget pressure was the most common reason, followed by missing integrations. Annualised churned ARR was TRY 11.8 million, which corresponds to gross revenue churn of 5.2%."

    label: faithful
    tags: [unit_format]
    context:
      - document: "Release_Notes_NebulaCRM_v3.4.md"
        passage: "Report export now runs on a streaming engine instead of building the whole file in memory. In our benchmark a report with 1 million rows exports to CSV in under 90 seconds; in v3.3, exports above 200,000 rows could time out. XLSX exports are capped at the format's own limit of 1,048,576 rows per sheet. Large exports continue in the background and the user is notified when the file is ready to download; download links expire after 7 days."
    answer: "In v3.4 a one-million-row report exports to CSV in less than a minute and a half, whereas in v3.3 exports above 200,000 rows could time out."

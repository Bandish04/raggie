# Raggie golden set — exact-answer questions over examples/sample-corpus.
# Schema, question types and scoring rules: examples/golden/README.md.
# Verified by `uv run scripts/corpus/validate.py` (every quote is checked against the
# text the ingestion worker extracts; every answer must appear in its evidence).
version: 1
corpus: "../sample-corpus"  # relative to this file
questions:

  # ── arge ────────────────────────────────────────────────────────
  - id: "arge-001"
    department: "arge"
    language: tr
    type: "single-fact"
    difficulty: easy
    question: "NebulaCRM platformu şu an kaç mikroservisten oluşuyor?"
    answer: "34"
    answer_variants: ["34 mikroservis"]
    expected_documents: ["Teknik_Mimari_NebulaCRM_2026.pdf", "Load_Test_Report_2026_Q2.docx"]
    evidence:
      - document: "Teknik_Mimari_NebulaCRM_2026.pdf"
        quote: "NebulaCRM, Kubernetes 1.30 üzerinde koşan 34 mikroservisten oluşur."
      - document: "Load_Test_Report_2026_Q2.docx"
        quote: "The test environment mirrored production topology: 34 services on Kubernetes"
  - id: "arge-002"
    department: "arge"
    language: tr
    type: "single-fact"
    difficulty: medium
    question: "Kurumsal Plus'taki ayrılmış veritabanı seçeneğini Eylül 2026 sonu itibarıyla kaç müşteri kullanıyor?"

name: HA chaos

# The six HA failure drills (plan 5b.5) on a kind cluster: 1 control plane + 3
# workers in 3 fake zones, the Helm `ha` profile sized down by
# scripts/ha/values-kind.yaml, the offline mock LLM and mock embeddings, k6
# load in-cluster. scripts/ha/up.sh builds and installs, scripts/ha/chaos.sh
# breaks things and asserts, scripts/ha/down.sh cleans up. Results (FAIL too)
# go to the job summary and docs/benchmarks/ha-chaos.md, uploaded with the
# logs as an artifact; commit the file from a run you want to quote.
on:
  schedule:
    - cron: "17 4 * * 2" # weekly, Tuesday 04:17 UTC
  workflow_dispatch:
    inputs:
      scenarios:
        description: "Subset to run (space-separated: pg redis qdrant edge ingestion upgrade); empty = all"
        required: false
        default: ""
      chat_vus:
        description: "Concurrent chat streams during each scenario"
        required: false
        default: "4"

permissions: read-all

concurrency:
  group: ha-chaos-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.26"
  HELM_VERSION: v4.1.4
  KUBECTL_VERSION: v1.33.4
  ACTIONLINT_VERSION: v1.7.12

jobs:
  static:
    name: static checks (actionlint, shellcheck, chart render + kubeconform)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: install actionlint, kubeconform, kube-linter (pinned)
        run: |
          # shellcheck source=/dev/null
          . scripts/ha/lib.sh
          go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          go install "github.com/yannh/kubeconform/cmd/kubeconform@${KUBECONFORM_VERSION}"
          go install "golang.stackrox.io/kube-linter/cmd/kube-linter@${KUBE_LINTER_VERSION}"
      - name: actionlint
        run: actionlint .github/workflows/ha-chaos.yml
      - name: shellcheck + unit tests (scripts/ha)
        run: |
          uvx --from "shellcheck-py==0.11.0.1" shellcheck -x -P SCRIPTDIR --severity=warning \
            scripts/ha/*.sh scripts/ha/tests/*.sh
          bash scripts/ha/tests/test_lib.sh
          bash scripts/ha/tests/test_chaos.sh
      - name: chart (lint, template incl. the kind values, kubeconform, kube-linter, guards)
        env:
          OUT_DIR: ${{ runner.temp }}/chart
        run: scripts/ha/validate-chart.sh

  chaos:
    name: chaos drills (kind, ha profile)
    needs: static
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      # Dispatch inputs reach the shell only through env, never inline.
      INPUT_CHAT_VUS: ${{ inputs.chat_vus }}
      INPUT_SCENARIOS: ${{ inputs.scenarios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: validate inputs
        run: |
          vus="${INPUT_CHAT_VUS:-4}"
          [[ "$vus" =~ ^[1-9][0-9]?$ ]] || { echo "::error::chat_vus must be 1-99"; exit 1; }
          for s in $INPUT_SCENARIOS; do
            case "$s" in
              pg | redis | qdrant | edge | ingestion | upgrade) ;;
              *) echo "::error::unknown scenario: $s"; exit 1 ;;
            esac
          done
          {
            echo "CHAT_VUS=$vus"
            echo "ARTIFACTS_DIR=$RUNNER_TEMP/ha-chaos"
          } >>"$GITHUB_ENV"
      - name: free disk space (six images + kind nodes)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
        with:
          version: ${{ env.KUBECTL_VERSION }}
      - name: install kind (pinned in scripts/ha/lib.sh, ahead of the runner's own)
        run: |
          # shellcheck source=/dev/null
          . scripts/ha/lib.sh
          go install "sigs.k8s.io/kind@${KIND_VERSION}"
          kind version
          echo "node image: ${KIND_NODE_IMAGE}"
      - name: up (build images, kind cluster, CNPG, chart)
        env:
          BUILD: "1"
          HELM_TIMEOUT: 25m
        run: scripts/ha/up.sh
      - name: chaos drills
        run: |
          read -ra scenarios <<<"${INPUT_SCENARIOS}"
          scripts/ha/chaos.sh "${scenarios[@]}"
      - name: collect cluster diagnostics
        if: always()
        run: |
          # shellcheck source=/dev/null
          . scripts/ha/lib.sh
          d="$ARTIFACTS_DIR/cluster"
          mkdir -p "$d"
          kind get clusters 2>/dev/null | grep -qx "$CLUSTER_NAME" || exit 0
          kubectl --context "kind-$CLUSTER_NAME" get all,pdb,networkpolicy,clusters.postgresql.cnpg.io -A -o wide >"$d/resources.txt" 2>&1 || true
          kubectl --context "kind-$CLUSTER_NAME" get events -A --sort-by=.lastTimestamp >"$d/events.txt" 2>&1 || true
          kubectl --context "kind-$CLUSTER_NAME" -n "$NAMESPACE" describe pods >"$d/pods-describe.txt" 2>&1 || true
          kind export logs "$d/kind" --name "$CLUSTER_NAME" >/dev/null 2>&1 || true
      - name: upload results and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ha-chaos
          path: |
            docs/benchmarks/ha-chaos.md
            ${{ runner.temp }}/ha-chaos/
          if-no-files-found: ignore
          retention-days: 30
      - name: down
        if: always()
        run: scripts/ha/down.sh || true

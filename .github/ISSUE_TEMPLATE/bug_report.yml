name: Bug report
description: Something does not work as documented
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        **Security vulnerabilities must not be reported here** — follow [SECURITY.md](https://github.com/alicangunduz/raggie/blob/main/SECURITY.md) instead.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Upload ...
        2. Ask ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Raggie version or commit
      placeholder: v0.1.0 or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - install.sh
        - docker compose from source
        - Kubernetes (Kustomize)
        - Kubernetes (Helm)
        - Other
    validations:
      required: true
  - type: dropdown
    id: embeddings
    attributes:
      label: Embeddings mode
      options:
        - local (default)
        - cloud / OpenAI-compatible
        - not sure
    validations:
      required: true
  - type: input
    id: llm
    attributes:
      label: LLM provider and model
      placeholder: e.g. vLLM + Qwen3, Ollama, OpenAI-compatible gateway, mock LLM
  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: e.g. Ubuntu 24.04 amd64, macOS 15 arm64 (Docker Desktop)
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        For example `docker compose logs edge control-plane ingestion-worker`.
        **Remove secrets, tokens, email addresses and document text before pasting.**
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability (those go to SECURITY.md).
          required: true

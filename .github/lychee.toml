# Link check (lychee). CI: .github/workflows/docs.yml — offline (repo-relative
# links + anchors) on every PR; external URLs nightly, as a non-blocking warning.
include_fragments = "full"
exclude_path = [
  "(^|/)internal/",
  "(^|/)node_modules/",
  "(^|/)\\.venv/",
  "(^|/)\\.next/",
  "(^|/)artifacts/",
  "(^|/)CHANGELOG\\.md$",
]
# Placeholders and local endpoints that only exist on a running install.
exclude = [
  "^https?://(localhost|127\\.0\\.0\\.1|0\\.0\\.0\\.0)",
  "^https?://[^/]*\\.example(:[0-9]+)?(/|$)",
  "^https?://example\\.(com|org)",
  "^https?://[^/]*\\.local(:[0-9]+)?(/|$)",
  "^mailto:",
]
# Rate-limited or bot-hostile hosts answer 403/429 to CI; that is not a dead link.
accept = ["200..=299", "403", "429"]
max_concurrency = 8
timeout = 20

{{- if .Values.ingress.enabled }}
{{- $i := .Values.ingress -}}
{{- $edge := include "raggie.componentName" (dict "root" . "component" "edge") -}}
{{- $web := include "raggie.componentName" (dict "root" . "component" "web") -}}
# Two Ingresses on two hostnames: the public chat/widget surface (edge paths
# only) and the admin surface (web). No session affinity: any edge replica can
# serve any stream, and resumes go through the database.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "raggie.fullname" . }}-public
  labels:
    {{- include "raggie.componentLabels" (dict "root" . "component" "edge") | nindent 4 }}
  annotations:
    {{- with $i.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ . | quote }}
    {{- end }}
    {{- with (merge (deepCopy $i.public.annotations) (deepCopy $i.annotations)) }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with $i.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $i.clusterIssuer }}
  tls:
    - hosts: [{{ $i.public.host | quote }}]
      secretName: {{ $i.public.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ $i.public.host | quote }}
      http:
        paths:
          {{- range list "/api/v1/chat" "/api/v1/widget" "/widgets" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $edge }}
                port:
                  name: http
          {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "raggie.fullname" . }}-admin
  labels:
    {{- include "raggie.componentLabels" (dict "root" . "component" "web") | nindent 4 }}
  annotations:
    {{- with $i.clusterIssuer }}
    cert-manager.io/cluster-issuer: {{ . | quote }}
    {{- end }}
    {{- with (merge (deepCopy $i.admin.annotations) (deepCopy $i.annotations)) }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with $i.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if $i.clusterIssuer }}
  tls:
    - hosts: [{{ $i.admin.host | quote }}]
      secretName: {{ $i.admin.tlsSecretName }}
  {{- end }}
  rules:
    - host: {{ $i.admin.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $web }}
                port:
                  name: http
{{- end }}

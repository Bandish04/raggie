{{- if .Values.serviceAccount.create }}
# No app component talks to the Kubernetes API: pods run with
# automountServiceAccountToken=false.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "raggie.serviceAccountName" . }}
  labels:
    {{- include "raggie.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}

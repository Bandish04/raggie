{{- if and .Values.secrets.generateDevSecret (not .Values.secrets.existingSecret) }}
{{- $name := printf "%s-dev-secrets" (include "raggie.fullname" .) -}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) | default dict -}}
{{- $data := (get $existing "data") | default dict -}}
# Throwaway development credentials (single profile only). Values are random
# on first install and reused on upgrade so the database keeps working.
# Production installs pass secrets.existingSecret instead.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "raggie.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key := list "JWT_SECRET" "WIDGET_TOKEN_SECRET" "INTERNAL_API_SECRET" "SETUP_TOKEN" "METRICS_TOKEN" "POSTGRES_PASSWORD" "REDIS_PASSWORD" "S3_SECRET_KEY" }}
  {{ $key }}: {{ get $data $key | default (randAlphaNum 48 | b64enc) }}
  {{- end }}
  S3_ACCESS_KEY: {{ get $data "S3_ACCESS_KEY" | default ("raggie-dev" | b64enc) }}
  LLMAAS_API_KEY: {{ get $data "LLMAAS_API_KEY" | default ("dev-not-a-real-key" | b64enc) }}
{{- end }}

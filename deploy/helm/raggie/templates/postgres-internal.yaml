{{- if eq .Values.postgresql.mode "internal" }}
{{- $sel := dict "root" . "component" "postgres" -}}
{{- $pg := .Values.postgresql -}}
# Single-replica PostgreSQL for the single profile (dev/demo). No failover,
# no backups: use postgresql.mode=cnpg or external for production.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "raggie.componentName" $sel }}
  labels:
    {{- include "raggie.componentLabels" $sel | nindent 4 }}
spec:
  selector:
    {{- include "raggie.selectorLabels" $sel | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "raggie.componentName" $sel }}
  labels:
    {{- include "raggie.componentLabels" $sel | nindent 4 }}
spec:
  serviceName: {{ include "raggie.componentName" $sel }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "raggie.selectorLabels" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "raggie.componentLabels" $sel | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        # postgres:*-alpine runs as uid/gid 70.
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ $pg.internal.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "raggie.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ $pg.database | quote }}
            - name: POSTGRES_USER
              value: {{ $pg.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "raggie.appSecretName" . }}
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\" -h 127.0.0.1"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -h 127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml $pg.internal.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            {{- include "raggie.tmpVolumeMount" . | nindent 12 }}
      volumes:
        - name: run
          emptyDir: {}
        {{- include "raggie.tmpVolume" . | nindent 8 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with ($pg.internal.persistence.storageClass | default .Values.storageClass) }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $pg.internal.persistence.size }}
{{- end }}

{{- if eq .Values.s3.mode "seaweedfs" }}
{{- $sel := dict "root" . "component" "seaweedfs" -}}
{{- $s := .Values.s3.seaweedfs -}}
# Single-node SeaweedFS (master + volume + filer + S3 gateway in one process)
# for the single profile. Production should use s3.mode=external.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "raggie.componentName" $sel }}
  labels:
    {{- include "raggie.componentLabels" $sel | nindent 4 }}
spec:
  selector:
    {{- include "raggie.selectorLabels" $sel | nindent 4 }}
  ports:
    - name: s3
      port: 8333
      targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "raggie.componentName" $sel }}
  labels:
    {{- include "raggie.componentLabels" $sel | nindent 4 }}
spec:
  serviceName: {{ include "raggie.componentName" $sel }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "raggie.selectorLabels" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "raggie.componentLabels" $sel | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seaweedfs
          image: {{ $s.image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "raggie.containerSecurityContext" . | nindent 12 }}
          # The S3 identity file is written from the Secret at start so the
          # credentials never land in a ConfigMap.
          command:
            - sh
            - -c
            - |
              set -eu
              cat > /tmp/s3.json <<JSON
              {"identities":[{"name":"raggie","credentials":[{"accessKey":"${S3_ACCESS_KEY}","secretKey":"${S3_SECRET_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
              JSON
              exec weed server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 \
                -volume.max=0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
          env:
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "raggie.s3SecretName" . }}
                  key: {{ include "raggie.s3AccessKeyKey" . }}
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "raggie.s3SecretName" . }}
                  key: {{ include "raggie.s3SecretKeyKey" . }}
          ports:
            - name: s3
              containerPort: 8333
          readinessProbe:
            tcpSocket: { port: s3 }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: s3 }
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml $s.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- include "raggie.tmpVolumeMount" . | nindent 12 }}
      volumes:
        {{- include "raggie.tmpVolume" . | nindent 8 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with ($s.persistence.storageClass | default .Values.storageClass) }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $s.persistence.size }}
{{- end }}

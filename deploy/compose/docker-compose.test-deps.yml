name: raggie-test-deps

# Disposable datastores for local test runs (scripts/test_deps.sh). Same images
# and versions as CI and the main compose stack.
services:
  postgres:
    image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_DB: raggie
      POSTGRES_USER: raggie
      POSTGRES_PASSWORD: raggie
    ports:
      - "${TEST_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Valkey: the Redis-compatible store the stack runs on.
  redis:
    image: valkey/valkey:8.1.11-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a
    ports:
      - "${TEST_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "${TEST_QDRANT_PORT:-56333}:6333"
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-lc",
          "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n' >&3 && grep -q 'all shards are ready' <&3",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

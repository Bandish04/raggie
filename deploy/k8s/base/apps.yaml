---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  labels: { app.kubernetes.io/name: control-plane, raggie.io/surface: admin }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: control-plane }
  template:
    metadata:
      labels: { app.kubernetes.io/name: control-plane, raggie.io/surface: admin }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app.kubernetes.io/name: control-plane }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: control-plane }
      containers:
        - name: control-plane
          image: raggie/control-plane:dev
          ports:
            - { name: http, containerPort: 8000 }
          envFrom:
            - configMapRef: { name: raggie-config }
            - secretRef: { name: raggie-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
          volumeMounts:
            # Large uploads are spooled to /tmp before streaming to object storage.
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-worker
  labels: { app.kubernetes.io/name: ingestion-worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: ingestion-worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ingestion-worker }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      # KEDA scales this lane out; keep replicas on different nodes.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: ingestion-worker }
      containers:
        - name: worker
          image: raggie/workers:dev
          env:
            - { name: WORKER_ROLE, value: "ingestion" }
          envFrom:
            - configMapRef: { name: raggie-config }
            - secretRef: { name: raggie-secrets }
          ports:
            - { name: health, containerPort: 9100 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            tcpSocket: { port: health }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: health }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "2", memory: "1Gi" }
          volumeMounts:
            # Uploaded files are streamed here before parsing.
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---

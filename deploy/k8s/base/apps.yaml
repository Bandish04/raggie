# Application workloads. All consume shared config + secrets via envFrom.
# edge = public Chat/RAG surface (SSE); control-plane = admin/mgmt; web = admin
# app; workers = ingestion + auto-eval lanes (no Service).
#
# Every pod runs under Pod Security "restricted": non-root with the image's own
# uid (10001 for the Python services, 65532 for the distroless edge, 1001 for
# web), read-only root filesystem with explicit writable volumes, no privilege
# escalation, all capabilities dropped, RuntimeDefault seccomp. Multi-replica
# workloads spread across nodes.
apiVersion: v1
kind: Service
metadata:
  name: embeddings
  labels: { app.kubernetes.io/name: embeddings }
spec:
  selector: { app.kubernetes.io/name: embeddings }
  ports:
    - { name: http, port: 8002, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embeddings
  labels: { app.kubernetes.io/name: embeddings }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: embeddings }
  template:
    metadata:
      labels: { app.kubernetes.io/name: embeddings }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: embeddings
          image: raggie/embeddings:dev
          ports:
            - { name: http, containerPort: 8002 }
          # Only the shared bearer: with it set the gateway requires it on /v1/*
          # (every caller sends it); no other secret reaches this pod.
          env:
            - name: INTERNAL_API_SECRET
              valueFrom:
                secretKeyRef: { name: raggie-secrets, key: INTERNAL_API_SECRET, optional: true }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 60
            periodSeconds: 20
          # Local mode keeps the dense, sparse and rerank ONNX models in memory.
          resources:
            requests: { cpu: "1", memory: "2Gi" }
            limits: { cpu: "4", memory: "4Gi" }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: edge
  labels: { app.kubernetes.io/name: edge, raggie.io/surface: public }
spec:
  selector: { app.kubernetes.io/name: edge }
  ports:
    - { name: http, port: 8080, targetPort: http }
    # Internal-only Prometheus listener (METRICS_ADDR); never routed by the ingress.
    - { name: metrics, port: 9090, targetPort: metrics }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  labels: { app.kubernetes.io/name: edge, raggie.io/surface: public }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: edge }
  template:
    metadata:
      labels: { app.kubernetes.io/name: edge, raggie.io/surface: public }
    spec:
      automountServiceAccountToken: false
      # Distroless `nonroot` user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app.kubernetes.io/name: edge }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: edge }
      containers:
        - name: edge
          image: raggie/edge:dev
          ports:
            - { name: http, containerPort: 8080 }
            - { name: metrics, containerPort: 9090 }
          envFrom:
            - configMapRef: { name: raggie-config }
            - secretRef: { name: raggie-secrets }
          env:
            # Bind the metrics listener on all pod interfaces so in-cluster
            # Prometheus can scrape it; the NetworkPolicy limits who reaches it.
            - { name: METRICS_ADDR, value: ":9090" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "2", memory: "512Mi" }
          volumeMounts:
            - name: widget
              mountPath: /app/widget
              readOnly: true
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: widget
          configMap: { name: raggie-widget }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:

---
# Runs due scheduled tasks (through the edge's internal run-task endpoint, with
# INTERNAL_API_SECRET), the FAILED-ingest retry sweep and the stale-PENDING
# sweep. Claims rows with FOR UPDATE SKIP LOCKED, so replicas never double-run.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler-worker
  labels: { app.kubernetes.io/name: scheduler-worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: scheduler-worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: scheduler-worker }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app.kubernetes.io/name: scheduler-worker }
      containers:
        - name: worker
          image: raggie/workers:dev
          env:
            - { name: WORKER_ROLE, value: "scheduler" }
          envFrom:
            - configMapRef: { name: raggie-config }
            - secretRef: { name: raggie-secrets }
          ports:
            - { name: health, containerPort: 9100 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            tcpSocket: { port: health }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: health }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels: { app.kubernetes.io/name: web, raggie.io/surface: admin }
spec:
  selector: { app.kubernetes.io/name: web }
  ports:
    - { name: http, port: 3000, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: { app.kubernetes.io/name: web, raggie.io/surface: admin }
spec:
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: web, raggie.io/surface: admin }
    spec:
      automountServiceAccountToken: false
      # The image's `nextjs` user.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: { type: RuntimeDefault }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app.kubernetes.io/name: web }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: web }
      containers:
        - name: web
          image: raggie/web:dev
          ports:
            - { name: http, containerPort: 3000 }
          # Settings only, no raggie-secrets: the internet-facing tier holds no
          # backend secret (CI checks the rendered env).
          envFrom:
            - configMapRef: { name: raggie-config }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
          volumeMounts:
            # Next.js writes its fetch/image cache here at runtime.
            - { name: next-cache, mountPath: /app/.next/cache }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: next-cache, emptyDir: {} }
        - { name: tmp, emptyDir: {} }

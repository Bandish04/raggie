# Stateful data plane, single replicas (evaluation-grade; see README "High
# availability"): Postgres, Qdrant and the SeaweedFS object store as
# StatefulSets with durable PVCs, Valkey (Redis-compatible event bus / rate
# limits) as a Deployment. Every pod runs under Pod Security "restricted":
# non-root with each image's own uid, read-only root filesystem (writable paths
# are explicit volumes), no privilege escalation, all capabilities dropped and
# the runtime's default seccomp profile. Images are pinned to multi-arch digests.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: postgres }
  ports:
    - name: pg
      port: 5432
      targetPort: pg
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels: { app.kubernetes.io/name: postgres }
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: postgres }
  template:
    metadata:
      labels: { app.kubernetes.io/name: postgres }
    spec:
      automountServiceAccountToken: false
      # uid/gid 70 is the `postgres` user of the official Alpine image.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
          ports:
            - { name: pg, containerPort: 5432 }
          env:
            - name: POSTGRES_DB
              valueFrom: { configMapKeyRef: { name: raggie-config, key: POSTGRES_DB } }
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: raggie-config, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: raggie-secrets, key: POSTGRES_PASSWORD } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "raggie"] }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "raggie"] }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "2", memory: "2Gi" }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            # Unix socket and lock files.
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  labels: { app.kubernetes.io/name: qdrant }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: qdrant }
  ports:
    - name: http
      port: 6333
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
  labels: { app.kubernetes.io/name: qdrant }
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: qdrant }
  template:
    metadata:
      labels: { app.kubernetes.io/name: qdrant }
    spec:
      automountServiceAccountToken: false
      # The -unprivileged image variant runs as uid/gid 1000.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.20.0-unprivileged@sha256:8c215051dc7bc15221b5f89c100a84a4b04d0dd8497fb73e6fa86fc948d1a41d
          # QDRANT_API_KEY in raggie-secrets (optional) enables Qdrant auth, as in
          # compose. It is exported only when non-empty: an empty
          # QDRANT__SERVICE__API_KEY would make Qdrant reject every request. The
          # services read the same key from the Secret; /readyz and /livez stay
          # open without it, so the probes keep working.
          command: ["sh", "-c"]
          args:
            - '[ -n "$RAGGIE_QDRANT_API_KEY" ] && export QDRANT__SERVICE__API_KEY="$RAGGIE_QDRANT_API_KEY"; exec ./entrypoint.sh'
          env:
            # No anonymous usage reports to the Qdrant project (on by default upstream).
            - { name: QDRANT__TELEMETRY_DISABLED, value: "true" }
            - name: RAGGIE_QDRANT_API_KEY
              valueFrom: { secretKeyRef: { name: raggie-secrets, key: QDRANT_API_KEY, optional: true } }
          ports:
            - { name: http, containerPort: 6333 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /livez, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "250m", memory: "1Gi" }
            limits: { cpu: "2", memory: "4Gi" }
          volumeMounts:
            - { name: storage, mountPath: /qdrant/storage }
            - { name: snapshots, mountPath: /qdrant/snapshots }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: snapshots, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata: { name: storage }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 10Gi } }
---
# Valkey (BSD-3-Clause), a drop-in for Redis 7. The Service keeps the `redis`
# name so REDIS_URL (redis://redis:6379) and the KEDA triggers stay valid.
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: { app.kubernetes.io/name: valkey }
spec:
  selector: { app.kubernetes.io/name: valkey }
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  labels: { app.kubernetes.io/name: valkey }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: valkey }
  template:
    metadata:
      labels: { app.kubernetes.io/name: valkey }
    spec:
      automountServiceAccountToken: false
      # uid 999 / gid 1000 is the `valkey` user of the official Alpine image.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: valkey
          image: valkey/valkey:8.1.11-alpine@sha256:2602ace2be6569bc2bbb06f873776516ab9089821525be34f4305c67eb9db02a
          # Auth is enabled when raggie-secrets has REDIS_PASSWORD; REDIS_URL must
          # then carry it too (redis://:<password>@redis:6379/0).
          command: ["sh", "-c"]
          args:
            - exec valkey-server --appendonly yes ${REDIS_PASSWORD:+--requirepass "$REDIS_PASSWORD"}
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: raggie-secrets, key: REDIS_PASSWORD, optional: true } }
          ports:
            - { name: redis, containerPort: 6379 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - valkey-cli --no-auth-warning ${REDIS_PASSWORD:+-a "$REDIS_PASSWORD"} ping | grep -q PONG
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: redis }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - { name: data, emptyDir: {} }
---
# SeaweedFS (Apache-2.0) single node: master + volume + filer + S3 gateway in one
# process. The S3 API serves the raw uploads on :9000 (MINIO_ENDPOINT); the
# MINIO_* settings are the generic S3 endpoint/credentials/bucket.
apiVersion: v1
kind: Service
metadata:
  name: objectstore
  labels: { app.kubernetes.io/name: objectstore }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: objectstore }
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: objectstore
  labels: { app.kubernetes.io/name: objectstore }
spec:
  serviceName: objectstore
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: objectstore }
  template:
    metadata:
      labels: { app.kubernetes.io/name: objectstore }
    spec:
      automountServiceAccountToken: false
      # uid/gid 1000 is the image's `seaweed` user (its entrypoint only switches
      # users when started as root).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.52@sha256:57877e32bb90073b37dc109b438ba66e84fd5ed9ced5f5c04f56444ef243ce59
          args: ["server", "-dir=/data", "-ip.bind=0.0.0.0", "-s3", "-s3.port=9000"]
          env:
            # SeaweedFS creates its S3 admin identity from these.
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: raggie-secrets, key: MINIO_ROOT_USER } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: raggie-secrets, key: MINIO_ROOT_PASSWORD } }
          ports:
            - { name: s3, containerPort: 9000 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /healthz, port: s3 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: s3 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 20Gi } }

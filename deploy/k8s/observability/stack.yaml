# Observability stack (prod overlay / opt-in). OTel Collector fans cross-language
# telemetry into Prometheus (metrics), Tempo (traces), and Loki (logs); Grafana
# reads all three. Single-replica baselines — production swaps in the upstream
# Helm charts behind the same service names. Every pod runs under Pod Security
# "restricted" (non-root with the image's own uid, read-only root filesystem with
# explicit writable volumes, no privilege escalation, no capabilities,
# RuntimeDefault seccomp).
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels: { app.kubernetes.io/part-of: raggie }
---
# ── Prometheus ───────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata: { name: prometheus-config, namespace: observability }
data:
  prometheus.yml: |
    global: { scrape_interval: 15s }
    scrape_configs:
      - job_name: raggie-edge
        metrics_path: /metrics
        static_configs: [{ targets: ['edge.raggie.svc.cluster.local:9090'] }]
      - job_name: raggie-control-plane
        metrics_path: /metrics
        static_configs: [{ targets: ['control-plane.raggie.svc.cluster.local:8000'] }]
      - job_name: otel-collector
        static_configs: [{ targets: ['otel-collector.observability.svc.cluster.local:8889'] }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus, namespace: observability }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: prometheus } }
  template:
    metadata: { labels: { app.kubernetes.io/name: prometheus } }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
          ports: [{ name: http, containerPort: 9090 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /-/healthy, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "512Mi" }
            limits: { cpu: "1", memory: "2Gi" }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: observability }
spec:
  selector: { app.kubernetes.io/name: prometheus }
  ports: [{ name: http, port: 9090, targetPort: 9090 }]
---
# ── OTel Collector ───────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata: { name: otel-collector-config, namespace: observability }
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: { endpoint: 0.0.0.0:4317 }
          http: { endpoint: 0.0.0.0:4318 }
    extensions:
      health_check: { endpoint: 0.0.0.0:13133 }
    processors:
      batch: {}
    exporters:
      prometheus: { endpoint: 0.0.0.0:8889 }
      otlp/tempo:
        endpoint: tempo.observability.svc.cluster.local:4317
        tls: { insecure: true }
      loki:
        endpoint: http://loki.observability.svc.cluster.local:3100/loki/api/v1/push
    service:
      extensions: [health_check]
      pipelines:
        traces:  { receivers: [otlp], processors: [batch], exporters: [otlp/tempo] }
        metrics: { receivers: [otlp], processors: [batch], exporters: [prometheus] }
        logs:    { receivers: [otlp], processors: [batch], exporters: [loki] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: otel-collector, namespace: observability }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: otel-collector } }
  template:
    metadata: { labels: { app.kubernetes.io/name: otel-collector } }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.110.0@sha256:0ed3688bbb02dabc0429ef648ebe3e9c53aca5e7c5a6b1a4a61b9f583b823e36
          args: ["--config=/etc/otel/config.yaml"]
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: prom, containerPort: 8889 }
            - { name: health, containerPort: 13133 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /, port: health }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: health }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          volumeMounts:
            - { name: config, mountPath: /etc/otel }
      volumes:
        - name: config
          configMap: { name: otel-collector-config }
---
apiVersion: v1
kind: Service
metadata: { name: otel-collector, namespace: observability }
spec:
  selector: { app.kubernetes.io/name: otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
    - { name: prom, port: 8889, targetPort: 8889 }
---
# ── Tempo (traces) ───────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata: { name: tempo-config, namespace: observability }
data:
  tempo.yaml: |
    server: { http_listen_port: 3200 }
    distributor:
      receivers:
        otlp:
          protocols:
            grpc: { endpoint: 0.0.0.0:4317 }
    storage:
      trace:
        backend: local
        local: { path: /var/tempo/blocks }
        wal: { path: /var/tempo/wal }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: tempo, namespace: observability }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: tempo } }
  template:
    metadata: { labels: { app.kubernetes.io/name: tempo } }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: tempo
          image: grafana/tempo:2.6.0@sha256:f55a8a1937fff0af3a760d376b476c8327fb30e432d5e7630d7938b67691e822
          args: ["-config.file=/etc/tempo/tempo.yaml"]
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: http, containerPort: 3200 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          volumeMounts:
            - { name: config, mountPath: /etc/tempo }
            - { name: data, mountPath: /var/tempo }
      volumes:
        - { name: config, configMap: { name: tempo-config } }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: tempo, namespace: observability }
spec:
  selector: { app.kubernetes.io/name: tempo }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: http, port: 3200, targetPort: 3200 }
---
# ── Loki (logs) ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata: { name: loki, namespace: observability }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: loki } }
  template:
    metadata: { labels: { app.kubernetes.io/name: loki } }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: loki
          image: grafana/loki:3.2.0@sha256:882e30c20683a48a8b7ca123e6c19988980b4bd13d2ff221dfcbef0fdc631694
          args: ["-config.file=/etc/loki/local-config.yaml"]
          ports: [{ name: http, containerPort: 3100 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          volumeMounts:
            # The image's local config keeps everything under /loki.
            - { name: data, mountPath: /loki }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: data, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: loki, namespace: observability }
spec:
  selector: { app.kubernetes.io/name: loki }
  ports: [{ name: http, port: 3100, targetPort: 3100 }]
---
# ── Grafana ──────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata: { name: grafana-datasources, namespace: observability }
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - { name: Prometheus, type: prometheus, access: proxy, url: http://prometheus:9090, isDefault: true }
      - { name: Tempo, type: tempo, access: proxy, url: http://tempo:3200 }
      - { name: Loki, type: loki, access: proxy, url: http://loki:3100 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana, namespace: observability }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: grafana } }
  template:
    metadata: { labels: { app.kubernetes.io/name: grafana } }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: grafana
          image: grafana/grafana:11.2.2@sha256:d5133220d770aba5cb655147b619fa8770b90f41d8489a821d33b1cd34d16f89
          ports: [{ name: http, containerPort: 3000 }]
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: "Viewer" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
            # SQLite database, plugins and sessions; logs go to stdout.
            - { name: data, mountPath: /var/lib/grafana }
            - { name: logs, mountPath: /var/log/grafana }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: datasources
          configMap: { name: grafana-datasources }
        - { name: data, emptyDir: {} }
        - { name: logs, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: grafana, namespace: observability }
spec:
  selector: { app.kubernetes.io/name: grafana }
  ports: [{ name: http, port: 3000, targetPort: 3000 }]
